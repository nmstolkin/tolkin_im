name: Tests

# Laeuft bei jeder Code-Aenderung (nicht bei den Status-Commits des Bots).
# Prueft Filterlogik und Parser, ohne Netz und ohne KI.
on:
  push:
    paths: ["**.py", "tests/**", "requirements*.txt"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
