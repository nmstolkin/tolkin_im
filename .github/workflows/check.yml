name: Wohnungssuche Berlin

on:
  schedule:
    # Zeiten in UTC. 8:00 + 14:00 UTC = 10:00 + 16:00 Uhr Berlin während der
    # Sommerzeit (MESZ, UTC+2). Während der Winterzeit (MEZ, UTC+1) wäre das
    # 9:00 + 15:00 Uhr; für exakt 10/16 Uhr im Winter müssten die Zeilen
    # manuell auf "0 9,15 * * 1-5" geändert werden.
    - cron: "0 8,14 * * 1-5"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen über den "Run workflow"-Button

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Playwright-Browser cachen
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Playwright-Browser (Chromium) installieren
        run: playwright install --with-deps chromium

      - name: Seiten prüfen
        run: python scrape.py
        env:
          # Standard: Anthropic (günstig, Batch API). Für den kostenlosen
          # Gemini-Tarif stattdessen "gemini" setzen und GEMINI_API_KEY als
          # Secret hinterlegen (ANTHROPIC_API_KEY wird dann nicht gebraucht).
          AI_PROVIDER: "gemini"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional: URL der Homescreen-App, wird als "Öffnen"-Link in der
          # Sammel-Push-Nachricht verwendet, z.B. https://nutzername.github.io/repo/
          APP_URL: ${{ vars.APP_URL }}

      - name: Status speichern (data/ zurück ins Repo committen)
        run: |
          git config user.name "immo-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ data.json site-status.json
          git diff --staged --quiet || git commit -m "Status aktualisiert [skip ci]"
          git push
