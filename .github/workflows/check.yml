name: Wohnungssuche Berlin

on:
  schedule:
    # 13:00 UTC = 15:00 Uhr Berlin während der Sommerzeit (MESZ, UTC+2).
    # Während der Winterzeit (MEZ, UTC+1) entspricht das 14:00 Uhr statt 15:00 Uhr,
    # da GitHub Actions cron ausschließlich UTC kennt. Für exakt 15 Uhr im Winter
    # müsste diese Zeile manuell auf "0 14 * * 1-5" geändert werden.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen über den "Run workflow"-Button

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Seiten prüfen
        run: python scrape.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Status speichern (data/ zurück ins Repo committen)
        run: |
          git config user.name "immo-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ data.json site-status.json
          git diff --staged --quiet || git commit -m "Status aktualisiert [skip ci]"
          git push
