<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Immo Watcher</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Immo Watcher">
<meta name="theme-color" content="#1e5c54">
<style>
  :root{
    --ink:#1c2321;
    --paper:#f4f1ea;
    --paper-raised:#ffffff;
    --petrol:#1e5c54;
    --petrol-deep:#12433d;
    --clay:#c96f4a;
    --line:#e4ddcf;
    --muted:#736c5f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  header{
    padding:calc(28px + env(safe-area-inset-top)) 20px 22px;
    background:var(--petrol);
    color:#fff;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
    position:sticky;
    top:0;
    z-index:5;
  }
  header .eyebrow{
    font-size:12.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    opacity:.72;
    margin:0 0 6px;
    font-weight:600;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header .meta{
    margin-top:10px;
    font-size:13px;
    opacity:.82;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#8fd6c7;display:inline-block;}

  .criteria{
    margin:16px 20px 0;
    padding:14px 16px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    font-size:13px;
    color:var(--muted);
    line-height:1.55;
  }
  .criteria b{color:var(--ink);}

  main{padding:18px 20px 8px;}

  .count-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:6px 2px 14px;
  }
  .count-row .n{
    font-size:14px;
    color:var(--muted);
  }
  .count-row .n strong{color:var(--ink);}
  .refresh{
    border:none;
    background:none;
    color:var(--petrol);
    font-size:14px;
    font-weight:600;
    padding:4px 2px;
  }
  .refresh:active{opacity:.5;}

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 16px 14px;
    margin-bottom:12px;
    display:block;
    text-decoration:none;
    color:inherit;
    position:relative;
  }
  .card:active{transform:scale(0.985);}
  .card .badge{
    position:absolute;
    top:14px;
    right:14px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--petrol-deep);
    background:#e3ede9;
    padding:3px 8px;
    border-radius:100px;
  }
  .card h2{
    margin:0 60px 8px 0;
    font-size:16.5px;
    font-weight:700;
    line-height:1.3;
    color:var(--ink);
  }
  .card .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .tag{
    font-size:12.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:100px;
    background:#f1ede2;
    color:var(--petrol-deep);
    border:1px solid var(--line);
  }
  .tag.rent{
    background:#fbeee6;
    color:#9a4a28;
    border-color:#f0d9c9;
  }
  .card .site{
    font-size:12px;
    color:var(--muted);
  }
  .card .found{
    font-size:11.5px;
    color:var(--muted);
    margin-top:6px;
  }

  .empty{
    text-align:center;
    padding:64px 24px 40px;
    color:var(--muted);
  }
  .empty .icon{font-size:38px;margin-bottom:14px;}
  .empty h3{color:var(--ink);margin:0 0 8px;font-size:17px;}
  .empty p{margin:0;font-size:14px;line-height:1.6;}

  .hint{
    margin:24px 20px 0;
    padding:14px 16px;
    border:1px dashed var(--line);
    border-radius:14px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Berlin · Wohnungssuche</p>
  <h1>Immo Watcher</h1>
  <div class="meta"><span class="dot" id="statusDot"></span><span id="lastUpdate">Lade Stand …</span></div>
</header>

<div class="criteria" id="criteriaBox"></div>

<main>
  <div class="count-row">
    <span class="n" id="countLabel">Lade Inserate …</span>
    <button class="refresh" onclick="location.reload()">Aktualisieren</button>
  </div>
  <div id="list"></div>
</main>

<div class="hint">
  Diese Liste wird automatisch mehrmals täglich im Hintergrund aktualisiert. Öffne die App einfach, wenn du nachsehen willst – bei neuen Treffern bekommst du zusätzlich eine Push-Nachricht.
</div>

<script>
async function load(){
  try{
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();
    render(data);
  }catch(e){
    document.getElementById('lastUpdate').textContent = 'Konnte Daten nicht laden';
    document.getElementById('countLabel').textContent = '';
  }
}

function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleString('de-DE', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}

function render(data){
  const c = data.criteria || {};
  const parts = [];
  if(c.min_rooms) parts.push(`ab <b>${c.min_rooms} Zimmer</b>`);
  if(c.min_size_qm) parts.push(`ab <b>${c.min_size_qm} qm</b>`);
  if(c.min_rent && c.max_rent) parts.push(`<b>${c.min_rent}–${c.max_rent} €</b> Kaltmiete`);
  if(c.districts && c.districts.length) parts.push(`in <b>${c.districts.join(', ')}</b>`);
  document.getElementById('criteriaBox').innerHTML = 'Kriterien: ' + parts.join(' · ');

  const updated = fmtDate(data.generated_at);
  document.getElementById('lastUpdate').textContent = updated
    ? 'Letzter Check: ' + updated + ' Uhr'
    : 'Noch kein automatischer Lauf erfolgt';

  const matches = (data.matches || []).slice().sort((a,b) => {
    return new Date(b.found_at || 0) - new Date(a.found_at || 0);
  });

  document.getElementById('countLabel').innerHTML = matches.length
    ? `<strong>${matches.length}</strong> passende Inserate`
    : 'Noch keine passenden Inserate gefunden';

  const list = document.getElementById('list');
  list.innerHTML = '';

  if(matches.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="icon">🏠</div>
        <h3>Noch nichts Passendes dabei</h3>
        <p>Sobald ein Inserat deine Kriterien erfüllt, erscheint es hier<br>und du bekommst eine Push-Nachricht.</p>
      </div>`;
    return;
  }

  for(const m of matches){
    const a = document.createElement('a');
    a.className = 'card';
    a.href = m.url || m.site_url || '#';
    a.target = '_blank';
    a.rel = 'noopener';

    const tags = [];
    if(m.rooms) tags.push(`<span class="tag">${m.rooms} Zi.</span>`);
    if(m.size_qm) tags.push(`<span class="tag">${m.size_qm} qm</span>`);
    if(m.rent) tags.push(`<span class="tag rent">${m.rent} €</span>`);
    if(m.district) tags.push(`<span class="tag">${m.district}</span>`);

    a.innerHTML = `
      <span class="badge">Neu</span>
      <h2>${(m.title || 'Wohnungsinserat')}</h2>
      <div class="tags">${tags.join('')}</div>
      <div class="site">${m.source_name || ''}</div>
      <div class="found">${m.found_at ? 'Gefunden am ' + fmtDate(m.found_at) + ' Uhr' : ''}</div>
    `;
    list.appendChild(a);
  }
}

load();
</script>

</body>
</html>
