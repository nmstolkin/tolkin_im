name: Wohnungssuche Berlin

on:
  schedule:
    # Zeiten in UTC: 8:00 + 14:00 UTC = 9:00 + 15:00 Uhr Berlin im Winter
    # (MEZ) bzw. 10:00 + 16:00 Uhr im Sommer (MESZ). GitHub-Cron kennt keine
    # Zeitzonen - die Stunde Versatz ist also gewollt, nicht ein Fehler.
    - cron: "0 8,14 * * 1-6"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen über den "Run workflow"-Button

concurrency:
  group: wohnungssuche
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Playwright-Browser cachen
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Playwright-Browser (Chromium) installieren
        run: playwright install --with-deps chromium

      - name: Seiten prüfen
        run: python scrape.py
        env:
          # "gemini" (kostenloser Tarif) oder "anthropic" (Batch API, guenstig).
          # "none" = Trockenlauf ohne KI, nur strukturierte Daten/Feeds.
          AI_PROVIDER: "gemini"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Diagnose: auf "1" setzen, um bei Seiten mit 0 Inseraten den
          # extrahierten Text ins Log zu schreiben. Danach wieder auf "0".
          DEBUG_EMPTY: "0"
          RUN_BUDGET_MINUTES: "120"
          # Optional: URL der Homescreen-App, wird als "Öffnen"-Link in der
          # Sammel-Push-Nachricht verwendet, z.B. https://nutzername.github.io/repo/
          APP_URL: ${{ vars.APP_URL }}

      # if: always() - auch nach Abbruch/Fehler sichern. Sonst gehen bereits
      # gepushte Treffer verloren und werden beim naechsten Lauf erneut gemeldet.
      - name: Status speichern
        if: always()
        run: |
          git config user.name "immo-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ data.json site-status.json run-stats.json
          git diff --staged --quiet && exit 0
          git commit -m "Status aktualisiert [skip ci]"
          # Bis zu 3 Versuche, falls parallel ein anderer Commit (z. B. aus der App) kam
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Status konnte nicht gepusht werden."; exit 1

      - name: Fehler melden
        if: failure()
        run: |
          curl -s -H "Title: Wohnungssuche: Lauf fehlgeschlagen" \
               -H "Priority: high" -H "Tags: warning" \
               -d "Der Suchlauf ist abgebrochen. Details im Actions-Tab des Repositories." \
               "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
