name: Wohnungssuche Berlin (schnell)

# Prueft nur die ertragreichsten Quellen (sites-fast.json) alle zwei Stunden,
# Montag bis Samstag, jeweils zur halben Stunde - versetzt zu den vollen
# Laeufen (8:00/14:00 UTC), damit sich beide nicht in die Quere kommen.
# GitHub-Cron rechnet in UTC: 7:30-19:30 UTC = 8:30-20:30 Uhr Berlin im
# Winter (MEZ) bzw. 9:30-21:30 Uhr im Sommer (MESZ).
#
# Moeglich ist der engere Takt durch den Ergebnis-Cache: unveraenderte Seiten
# kosten keinen KI-Aufruf mehr. Inserate stehen im Median rund 12 Stunden
# online, bei schnellen Vermietern oft nur 1-3 Stunden.

on:
  schedule:
    - cron: "30 7-19/2 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

# Verhindert, dass sich schneller und vollstaendiger Lauf ueberschneiden und
# beim Zurueckschreiben der Statusdateien gegenseitig ueberholen.
concurrency:
  group: wohnungssuche
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Playwright-Browser cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Playwright-Browser (Chromium) installieren
        run: playwright install --with-deps chromium

      - name: Seiten prüfen (Schnell-Liste)
        run: python scrape.py
        env:
          SITES_FILE: "sites-fast.json"
          AI_PROVIDER: "gemini"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG_EMPTY: "0"
          RUN_BUDGET_MINUTES: "40"
          APP_URL: ${{ vars.APP_URL }}

      # if: always() - auch nach Abbruch/Fehler sichern. Sonst gehen bereits
      # gepushte Treffer verloren und werden beim naechsten Lauf erneut gemeldet.
      - name: Status speichern
        if: always()
        run: |
          git config user.name "immo-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ data.json site-status.json run-stats.json
          git diff --staged --quiet && exit 0
          git commit -m "Status aktualisiert (schnell) [skip ci]"
          # Bis zu 3 Versuche, falls parallel ein anderer Commit (z. B. aus der App) kam
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Status konnte nicht gepusht werden."; exit 1

      - name: Fehler melden
        if: failure()
        run: |
          curl -s -H "Title: Wohnungssuche: Lauf fehlgeschlagen" \
               -H "Priority: high" -H "Tags: warning" \
               -d "Der Suchlauf ist abgebrochen. Details im Actions-Tab des Repositories." \
               "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
